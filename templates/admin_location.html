<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location</title>

<style>

body{

background:#111;

color:white;

font-family:Arial;

padding:40px;

}

.container{

max-width:700px;

margin:auto;

background:#1b1b1b;

padding:30px;

border-radius:20px;

}

h1{

text-align:center;

margin-bottom:30px;

}

.item{

margin:18px 0;

font-size:20px;

}

a{

display:inline-block;

margin-top:30px;

padding:15px 30px;

background:#ff4d6d;

color:white;

text-decoration:none;

border-radius:10px;

font-size:18px;

}

</style>

</head>

<body>

<div class="container">

<h1>📍 Live Location Dashboard</h1>

<div class="item">
<b>Latitude :</b> <span id="lat">{{ location.latitude }}</span>
</div>

<div class="item">
<b>Longitude :</b> <span id="lng">{{ location.longitude }}</span>
</div>

<div class="item">
<b>Accuracy :</b> <span id="acc">{{ location.accuracy }}</span>
</div>

<div class="item">
<b>City :</b> <span id="city">{{ location.city }}</span>
</div>

<div class="item">
<b>State :</b> <span id="state">{{ location.state }}</span>
</div>

<div class="item">
<b>Country :</b> <span id="country">{{ location.country }}</span>
</div>

<div class="item">
<b>Last Update :</b> <span id="time">{{ location.last_update }}</span>
</div>

<a id="mapBtn" href="{{ location.maps }}" target="_blank">

🗺️ Open Google Maps

</a>

</div>

<script>

async function refreshLocation(){

    try{

        const res = await fetch("/api/location");

        const data = await res.json();

        document.getElementById("lat").innerHTML = data.latitude;
        document.getElementById("lng").innerHTML = data.longitude;
        document.getElementById("acc").innerHTML = data.accuracy;
        document.getElementById("city").innerHTML = data.city;
        document.getElementById("state").innerHTML = data.state;
        document.getElementById("country").innerHTML = data.country;
        document.getElementById("time").innerHTML = data.last_update;

        document.getElementById("mapBtn").href = data.maps;

    }

    catch(e){

        console.log(e);

    }

}

setInterval(refreshLocation,15000);

refreshLocation();

</script>

</body>

</html>
